name: CI Build

on:
  push:
    branches: [ dev/*, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Fork-only (shaiss/shai): offline self-tests for the Wave 0 shadow labeler.
  # No secrets, no network, no shai binary; never runs the labeler itself.
  wave0-selftest:
    name: Wave 0 self-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: shellcheck run-shadow.sh
        run: shellcheck -x wave0/run-shadow.sh

      - name: All-empty alarm self-test
        run: ./wave0/run-shadow.sh --test-all-empty-alarm

  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: shai
            asset_name: shai-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary_name: shai
            asset_name: shai-linux-aarch64
#          - os: windows-latest
#            target: x86_64-pc-windows-msvc
#            binary_name: shai.exe
#            asset_name: shai-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: shai
            asset_name: shai-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: shai
            asset_name: shai-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools

      # rust-toolchain.toml pins the compiler, so the target std from the
      # dtolnay step (installed for `stable`) is not on the active toolchain.
      # Install the pinned toolchain and add the target to it on every runner.
      - name: Add target to pinned toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-target-

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          strip ${{ matrix.asset_name }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 10

  install-script:
    name: Test install.sh on ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the binary built for this platform
        uses: actions/download-artifact@v4
        with:
          name: shai-${{ matrix.platform }}
          path: ${{ runner.temp }}/assets

      - name: Serve it as a release asset to install.sh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          assets="$RUNNER_TEMP/assets"
          cp "$assets/shai-$PLATFORM" "$assets/shai-unstable-$PLATFORM"
          mkdir -p "$RUNNER_TEMP/stub"
          cp .github/scripts/release-api-stub.sh "$RUNNER_TEMP/stub/curl"
          chmod +x "$RUNNER_TEMP/stub/curl"
          {
            echo "STUB_PLATFORM=$PLATFORM"
            echo "STUB_ASSET_DIR=$assets"
            echo "STUB_REAL_CURL=$(command -v curl)"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/stub" >> "$GITHUB_PATH"

      - name: sh install.sh, then shai --version
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          expected="shai version $(grep -m1 '^version' shai-cli/Cargo.toml | cut -d'"' -f2)"
          for release in latest unstable; do
            echo "::group::SHAI_RELEASE=$release"
            rm -f "$HOME/.local/bin/shai"
            SHAI_RELEASE="$release" sh install.sh | tee install.log
            grep -q "Detected platform: $PLATFORM" install.log
            version="$("$HOME/.local/bin/shai" --version)"
            echo "$version"
            test "$version" = "$expected"
            echo "::endgroup::"
          done
