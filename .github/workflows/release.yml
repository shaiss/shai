name: Release

# shaiss/shai fork releases are built from a reviewed, already-pushed tag
# matching vX.Y.Z-shaiss.N (for example v0.2.2-shaiss.1). This workflow
# checks out that tag, builds --locked with no actions/cache on pinned
# rustc 1.100.0, creates the GitHub Release, and uploads the binaries
# plus SHA256SUMS. A rebuild needs a new tag; published assets are not
# overwritten.
#
# Creating or pushing the tag is a public write and needs its own approval.
# install.sh is intentionally left pointing at ovh/shai.

on:
  push:
    tags:
      # GitHub tag filters are globs, not regex. The publish step's regex is the real check.
      - "v[0-9]*.[0-9]*.[0-9]*-shaiss.[0-9]*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: shai
            asset_name: shai-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary_name: shai
            asset_name: shai-linux-aarch64
          #- os: windows-latest
          #  target: x86_64-pc-windows-msvc
          #  binary_name: shai.exe
          #  asset_name: shai-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: shai
            asset_name: shai-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: shai
            asset_name: shai-macos-aarch64

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        # rustup reads rust-toolchain.toml (1.100.0); do not pass "stable"
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show
          rustup target add "$TARGET"
          rustc --version --verbose

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools

      # No actions/cache: tag/release builds must not restore main-scope caches.
      # A poisoned cache entry (registry, git deps, or target/) could otherwise
      # be restored into a release job and ship into published artifacts.

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
          ASSET: ${{ matrix.asset_name }}
        run: |
          cp "target/${TARGET}/release/${BINARY_NAME}" "$ASSET"
          strip "$ASSET"
          shasum -a 256 "$ASSET" | tee "$ASSET.sha256"

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
          ASSET: ${{ matrix.asset_name }}
        run: |
          cp "target/${TARGET}/release/${BINARY_NAME}" "$ASSET"
          shasum -a 256 "$ASSET" | tee "$ASSET.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets via gh
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: .

      - name: Create release with assets and SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-shaiss\.[0-9]+$ ]]; then
            echo "refusing to publish unexpected tag: $TAG" >&2
            exit 1
          fi
          for f in shai-linux-x86_64 shai-linux-aarch64 shai-macos-x86_64 shai-macos-aarch64; do
            test -f "$f" || { echo "missing asset: $f" >&2; exit 1; }
            test -f "$f.sha256" || { echo "missing builder checksum: $f.sha256" >&2; exit 1; }
            sha256sum -c "$f.sha256"
          done
          sha256sum shai-linux-x86_64 shai-linux-aarch64 shai-macos-x86_64 shai-macos-aarch64 | tee SHA256SUMS
          NOTES="shaiss/shai ${TAG} at ${SHA}"
          if gh release view -R "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create -R "$GITHUB_REPOSITORY" "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            shai-linux-x86_64 shai-linux-aarch64 shai-macos-x86_64 shai-macos-aarch64 \
            SHA256SUMS
