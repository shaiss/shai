name: Release

on:
  release:
    types: [created]

permissions: {}

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: shai
            asset_name: shai-linux-x86_64
          #- os: windows-latest
          #  target: x86_64-pc-windows-msvc
          #  binary_name: shai.exe
          #  asset_name: shai-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: shai
            asset_name: shai-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: shai
            asset_name: shai-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools

      - name: Add musl target (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: rustup target add x86_64-unknown-linux-musl

      # No actions/cache: tag/release builds must not restore main-scope caches.
      # A poisoned cache entry (registry, git deps, or target/) could otherwise
      # be restored into a release job and ship into published artifacts.

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
          ASSET: ${{ matrix.asset_name }}
        run: |
          cp "target/${TARGET}/release/${BINARY_NAME}" "$ASSET"
          strip "$ASSET"
          shasum -a 256 "$ASSET"

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary_name }}
          ASSET: ${{ matrix.asset_name }}
        run: |
          cp "target/${TARGET}/release/${BINARY_NAME}" "$ASSET"
          shasum -a 256 "$ASSET"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: .

      - name: Upload assets and SHA256SUMS to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum shai-linux-x86_64 shai-macos-x86_64 shai-macos-aarch64
          gh release upload -R "$GITHUB_REPOSITORY" "$TAG" \
            shai-linux-x86_64 shai-macos-x86_64 shai-macos-aarch64
          sha256sum shai-linux-x86_64 shai-macos-x86_64 shai-macos-aarch64 > SHA256SUMS
          gh release upload -R "$GITHUB_REPOSITORY" "$TAG" SHA256SUMS --clobber
