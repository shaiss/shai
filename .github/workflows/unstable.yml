name: Unstable Build

# Disabled on shaiss/shai. Do not re-enable this workflow in the GitHub UI
# and do not restore a push-to-main publisher without a new review.
#
# Diagnosis (2026-11-20, read-only gh):
# - Repo setting default_workflow_permissions is "read"
#   (GET /repos/shaiss/shai/actions/permissions/workflow).
# - This file never declared `permissions: contents: write` on
#   create-unstable-release, so the job token was Contents: read only.
# - Build jobs succeeded; publish failed at "Create unstable release"
#   with `HTTP 403: Resource not accessible by integration
#   (https://api.github.com/repos/shaiss/shai/releases)`.
#   Runs (America/New_York times in parentheses):
#     39303525795 / job 118236022392  2026-10-19 18:36:57Z (2:36 PM ET)
#     39303280057 / job 118234848361  2026-10-19 18:34:27Z (2:34 PM ET)
#     39297870185 / job 118216697219  2026-10-19 17:56:33Z (1:56 PM ET)
#     39294490845 / job 118207430553  2026-10-19 17:37:28Z (1:37 PM ET)
#     39293690414 / job 118205698451  2026-10-19 17:34:00Z (1:34 PM ET)
#   Run 39293891657 skipped publish because a macOS build was cancelled.
#   `gh release delete unstable` only reported "release not found"
#   (continue-on-error); shaiss/shai has never had a GitHub Release.
# - The workflow was then disabled_manually in the GitHub UI
#   (workflow 382684660 updated_at 2026-10-19T14:38:04-04:00).
# - Even with contents: write, a floating `unstable` prerelease is the
#   wrong pin target: fork releases are built from a reviewed
#   v*-shaiss.* tag with SHA256SUMS (see release.yml). An inherited
#   upstream `unstable` tag already points at 5db78ea73d31, so
#   `gh release create unstable` would attach new binaries to that old
#   commit, not to current main.
#
# Fork releases use .github/workflows/release.yml.

on:
  push:
    branches-ignore:
      - "**"

permissions: {}

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: echo "unstable.yml is disabled on shaiss/shai"
